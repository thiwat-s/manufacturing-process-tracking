services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manufacturing
      POSTGRES_PASSWORD: manufacturing
      POSTGRES_DB: manufacturing
    volumes:
      - manufacturing-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manufacturing -d manufacturing']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://manufacturing:manufacturing@db:5432/manufacturing?schema=public
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/dashboard || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  manufacturing-data:
